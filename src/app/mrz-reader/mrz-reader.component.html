<div *ngIf="!isLoaded" id="loading-indicator" class="loading-indicator">
  <div class="spinner"></div>
</div>

<div class="card">
  <h2>MRZ Reader (File)</h2>
  <input type="file" id="file" accept="image/*" (change)="onChange($event)" />
  <div id="imageview" class="imageview">
    <img id="image" alt="" />
    <canvas id="overlay" class="overlay"></canvas>
  </div>
  <textarea id="detection_result" placeholder="The recognized MRZ lines and the parsed fields will appear here..."></textarea>
</div>
